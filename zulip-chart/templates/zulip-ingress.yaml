apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zulip.fullname" . }}
  labels:
    {{- include "zulip.labels" . | nindent 4 }}
spec:
  ingressClassName: ingressive
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zulip.fullname" . }}
                port:
                  number: 80
